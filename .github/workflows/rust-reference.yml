name: Rust scalar reference

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pushes to main get a group of their own so no run on main is ever cancelled
  # or left waiting behind another one; only superseded pull-request runs are.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scalar-reference:
    name: Apple Silicon / stable
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Apple Silicon host
        run: test "$(uname -m)" = arm64
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The dev profile is optimized (opt-level 2) and keeps debug assertions and
      # overflow checks, so it is the stricter of the two profiles. A second pass
      # in the release profile doubled the run time to about 25 minutes.
      - name: Tests
        run: cargo test --workspace
