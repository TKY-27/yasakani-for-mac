[workspace]
members = ["crates/yskn-format", "crates/yskn-ref"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TKY-27/yasakani-for-mac"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
yskn-format = { path = "crates/yskn-format" }
