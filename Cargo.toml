[workspace]
members = ["crates/yskn-format", "crates/yskn-ref", "crates/yskn-engine", "crates/yskn-metal", "crates/yskn-text"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TKY-27/yasakani-for-mac"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
yskn-format = { path = "crates/yskn-format" }

# Debug builds keep assertions and overflow checks but are optimized:
# the scalar reference is too slow to test otherwise.
[profile.dev]
opt-level = 2
